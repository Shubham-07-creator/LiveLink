<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/video.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="LiveLink — Enterprise-grade, ultra-secure HD video conferencing. Sub-50ms latency, 1-click meeting recording, 1-to-1 private rooms, and instant group collaboration."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/video.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Performance: Preconnect & DNS-Prefetch for Render Backend and Google Services -->
    <link rel="dns-prefetch" href="https://livelink-backend-po12.onrender.com" />
    <link rel="preconnect" href="https://livelink-backend-po12.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter for World-Class Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LiveLink — Simple, Fast &amp; Secure Video Meetings</title>
    <!-- Google Identity Services for Official Google Sign In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

    <noscript>You need to enable JavaScript to run LiveLink.</noscript>
    <div id="root"></div>
  </body>
